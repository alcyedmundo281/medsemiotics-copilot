[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medsemiotics"]

[project]
name = "medsemiotics-teaching-copilot"
version = "0.1.0"
description = "AI-assisted academic teaching and content-management platform for Neurology and Gastroenterology"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "MedSemiotics Team" },
]
dependencies = [
    "fastapi>=0.110.0",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12.20240311",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["medsemiotics"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["medsemiotics"]
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
    "medsemiotics.integrations.google_calendar.*",
    # Only the operator credential glue calls into untyped google-auth constructors; the rest of
    # the Classroom package stays under strict call checking.
    "medsemiotics.integrations.google_classroom.operator_credentials",
    "medsemiotics.integrations.google_classroom.owner_authorized_caller",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=medsemiotics --cov-report=term-missing"
