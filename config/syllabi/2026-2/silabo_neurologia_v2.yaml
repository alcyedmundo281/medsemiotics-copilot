schedule_18_weeks:
- week: 1
  date: '2026-06-23'
  topic_id: neuro-intro
  title: Introducción a la semiología neurológica e historia clínica orientada al
    problema
  status: completed
  hemisemestre: 1
  web_module: https://powersemiotics.com/medsemiotics/neurologia.html
- week: 2
  date: '2026-06-30'
  topic_id: mental-status
  title: Estado mental, funciones cerebrales superiores y semiología del lenguaje
  status: completed
  hemisemestre: 1
- week: 3
  date: '2026-07-07'
  topic_id: cranial-nerves-1
  title: Pares craneales I al VI (Vía visual, fondo de ojo y motilidad ocular)
  status: completed
  hemisemestre: 1
- week: 4
  date: '2026-07-14'
  topic_id: cranial-nerves-2
  title: Pares craneales VII al XII (Facial, auditivo-vestibular, bulbares y deglución)
  status: completed
  hemisemestre: 1
- week: 5
  date: '2026-07-21'
  topic_id: motor-system
  title: 'Sistema motor: inspección, tono, trofismo y gradación de fuerza muscular'
  status: completed
  hemisemestre: 1
- week: 6
  date: '2026-07-28'
  topic_id: reflexes-pyramidal
  title: Reflejos osteotendinosos y signos de liberación piramidal (Babinski y sucedáneos)
  status: completed
  hemisemestre: 1
- week: 7
  date: '2026-08-04'
  topic_id: sensory-system
  title: 'Sistema sensitivo: sensibilidad superficial (tacto/dolor/temperatura) y
    profunda'
  status: completed
  hemisemestre: 1
- week: 8
  date: '2026-08-11'
  topic_id: coordination-cerebellum
  title: Coordinación motora, marcha y síndrome cerebeloso (ataxias)
  status: completed
  hemisemestre: 1
- week: 9
  date: '2026-08-18'
  topic_id: eval-hemisemestre-1
  title: 'Evaluación del Primer Hemisemestre: Escala NIHSS y Eventos Cerebrovasculares
    (ACV)'
  status: completed
  hemisemestre: 1
- week: 10
  date: '2026-08-25'
  topic_id: trastornos-movimiento-1
  title: 'Trastornos del movimiento I: Enfermedad de Parkinson Idiopática (EPI)'
  status: completed
  hemisemestre: 2
  web_module: https://powersemiotics.com/medsemiotics/neurologia/trastornos-movimiento-1.html
- week: 11
  date: '2026-09-01'
  topic_id: trastornos-movimiento-2
  title: 'Trastornos del movimiento II: Parkinsonismos Atípicos (PSP/AMS/DCB) y Coreas'
  status: projected
  hemisemestre: 2
  web_module: https://powersemiotics.com/medsemiotics/neurologia/trastornos-movimiento-2.html
- week: 12
  date: '2026-09-08'
  topic_id: demencias-cognitivo
  title: Síndromes demenciales, Enfermedad de Alzheimer y deterioro neurocognitivo
  status: projected
  hemisemestre: 2
  web_module: https://powersemiotics.com/medsemiotics/neurologia/demencias.html
- week: 13
  date: '2026-09-15'
  topic_id: cefaleas-red-flags
  title: Cefaleas primarias (Migraña, Tensional, Cluster) y Banderas Rojas
  status: projected
  hemisemestre: 2
- week: 14
  date: '2026-09-22'
