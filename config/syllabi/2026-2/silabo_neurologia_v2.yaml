  hemisemestre: 2
- week: 17
  date: '2026-10-13'
  topic_id: coma-neurocritico
  title: Coma, alteraciones de conciencia, muerte encefálica y urgencias neurocríticas
  status: projected
  hemisemestre: 2
- week: 18
  date: '2026-10-20'
  topic_id: eval-hemisemestre-2
  title: Evaluación Final Integral del Segundo Hemisemestre
  status: projected
  hemisemestre: 2
