# Public baseline teaching guides. Every Calendar publication still requires named human approval.
semester_id: "2026-2"
course_code: "GASTRO"
enabled: true
guides:
  - topic_id: "gastro-intro"
    topic_title: "Introducción a la semiología gastrointestinal"
    learning_objectives:
      - "Realizar una anamnesis gastrointestinal orientada por síntoma, cronología y factores asociados."
      - "Aplicar una secuencia sistemática de inspección, auscultación, percusión y palpación abdominal."
    critical_points:
      - "Integrar síntomas digestivos con estado hemodinámico, nutricional y signos extraabdominales."
      - "Reconocer signos de alarma que requieren evaluación prioritaria."
    teaching_questions:
      - "¿Qué datos de la historia modifican primero el nivel de urgencia?"
      - "¿Por qué la auscultación precede a la palpación abdominal?"
    common_pitfalls:
      - "Describir dolor abdominal sin cronología ni relación con alimentos, deposiciones o movimiento."
      - "Omitir la evaluación general y concentrarse exclusivamente en el abdomen."
    material_notes:
      - "Formato de historia gastrointestinal y caso clínico introductorio."

  - topic_id: "abdominal-pain"
    topic_title: "Dolor abdominal"
    learning_objectives:
      - "Caracterizar el dolor abdominal por inicio, localización, irradiación, evolución y síntomas asociados."
      - "Diferenciar patrones viscerales, parietales y referidos para orientar el diagnóstico sindrómico."
    critical_points:
      - "La estabilidad clínica y los signos de irritación peritoneal tienen prioridad sobre el diagnóstico etiológico fino."
      - "La reevaluación seriada puede revelar cambios que no estaban presentes al inicio."
    teaching_questions:
      - "¿Qué hallazgos obligan a una valoración urgente?"
      - "¿Cómo cambia el diferencial cuando el dolor migra o se vuelve localizado?"
    common_pitfalls:
      - "Excluir enfermedad grave por un examen inicial poco llamativo."
      - "Interpretar una localización como diagnóstico sin integrar edad, contexto y síntomas asociados."
    material_notes:
      - "Mapa de regiones abdominales y viñetas para razonamiento por patrones."

  - topic_id: "dysphagia"
    topic_title: "Disfagia"
    learning_objectives:
      - "Distinguir disfagia orofaríngea de esofágica mediante historia dirigida."
      - "Usar la progresión y la relación con sólidos o líquidos para organizar hipótesis clínicas."
    critical_points:
      - "Identificar riesgo de aspiración, impacto alimentario, pérdida de peso y otros signos de alarma."
      - "Diferenciar disfagia de odinofagia, globus y anorexia."
    teaching_questions:
      - "¿Qué síntomas acompañantes sugieren un problema orofaríngeo?"
      - "¿Qué patrón temporal orienta a obstrucción mecánica frente a trastorno motor?"
    common_pitfalls:
      - "Usar el término disfagia sin precisar fase, consistencia desencadenante ni progresión."
      - "Omitir preguntas sobre tos, voz húmeda o episodios de aspiración."
    material_notes:
      - "Algoritmo didáctico de clasificación y videos clínicos sin datos identificables."

  - topic_id: "jaundice"
    topic_title: "Ictericia"
    learning_objectives:
      - "Reconocer ictericia y relacionarla con patrones prehepáticos, hepatocelulares y colestásicos."
      - "Integrar color de orina y heces, prurito, dolor, fiebre y exposición a fármacos en la evaluación inicial."
    critical_points:
      - "Distinguir hiperbilirrubinemia conjugada y no conjugada como paso organizador, no como diagnóstico final."
      - "Fiebre, dolor, alteración del estado mental o inestabilidad requieren evaluación prioritaria."
    teaching_questions:
      - "¿Qué combinación clínica orienta a colestasis?"
      - "¿Cómo cambia el razonamiento cuando hay anemia o datos de hemólisis?"
    common_pitfalls:
      - "Atribuir toda ictericia a enfermedad hepática primaria."
      - "Ignorar medicamentos, suplementos y evolución temporal."
    material_notes:
      - "Esquema de metabolismo de bilirrubina y casos comparativos."

  - topic_id: "ascites"
    topic_title: "Ascitis"
    learning_objectives:
      - "Explorar distensión abdominal y reconocer hallazgos clínicos compatibles con líquido libre."
      - "Organizar las causas de ascitis según contexto clínico y mecanismos fisiopatológicos."
    critical_points:
      - "La sensibilidad del examen físico depende del volumen y debe integrarse con la evaluación clínica completa."
      - "Dolor, fiebre, deterioro clínico o encefalopatía son signos de alarma que requieren valoración prioritaria."
    teaching_questions:
      - "¿Qué hallazgos apoyan hipertensión portal como mecanismo?"
      - "¿Qué información diagnóstica aporta el análisis del líquido ascítico?"
    common_pitfalls:
      - "Confundir obesidad, distensión gaseosa o masa abdominal con ascitis."
      - "Omitir la búsqueda de edema, circulación colateral y signos de hepatopatía crónica."
    material_notes:
      - "Esquema de percusión abdominal y tabla didáctica para análisis de líquido ascítico."
